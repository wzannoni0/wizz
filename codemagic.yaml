# Codemagic CI per Wizz (wzannoni0/wizz, branch main)
# Il progetto Flutter vive in wizz_app/
workflows:
  android-debug:
    name: Android Debug APK
    instance_type: linux
    max_build_duration: 60
    working_directory: wizz_app
    environment:
      flutter: stable
    scripts:
      - name: Get packages
        script: flutter pub get
      - name: Analyze
        script: flutter analyze
      - name: Build debug APK
        script: flutter build apk --debug
    artifacts:
      - build/app/outputs/flutter-apk/*.apk

  ios-simulator:
    name: iOS Simulator (no signing)
    instance_type: mac_mini
    max_build_duration: 60
    working_directory: wizz_app
    environment:
      flutter: stable
      xcode: latest
    scripts:
      - name: Get packages
        script: flutter pub get
      - name: Build for simulator (senza firma Apple)
        script: flutter build ios --simulator --debug --no-codesign
    artifacts:
      - build/ios/iphonesimulator/*.app
