name: Android Release AAB (firmato)
on:
  workflow_dispatch:

jobs:
  aab:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wizz_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - name: Ripristina keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > $RUNNER_TEMP/wizz-release.jks
      - name: Build AAB firmato
        run: flutter build appbundle --release
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/wizz-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with:
          name: wizz-release-aab
          path: wizz_app/build/app/outputs/bundle/release/*.aab
